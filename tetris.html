<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 6vw;
      max-font-size: 28px;
    }

    canvas {
      background: #111;
      border: 2px solid #444;
      width: 60vw;          /* schmaler für Tetris */
      max-width: 260px;     /* auf großen Screens begrenzen */
      touch-action: none;
    }

    #info {
      margin-top: 10px;
      font-size: 4vw;
      max-font-size: 18px;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      background: #00bcd4;
      color: #fff;
      cursor: pointer;
      font-size: 4vw;
      max-font-size: 18px;
    }

    button:hover {
      background: #008ba3;
    }

    /* On-Screen-Steuerkreuz */
    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
      width: 50vw;
      max-width: 220px;
    }

    .controls button {
      padding: 12px;
      font-size: 5vw;
      max-font-size: 20px;
    }

    .controls .empty {
      background: transparent;
      border: none;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Tetris</h1>
  <canvas id="tetris"></canvas>
  <div id="info">
    Steuern: Pfeiltasten (links/rechts/unten, oben = drehen) oder Buttons.<br>
    Punkte: <span id="score">0</span>
  </div>
  <div class="buttons">
    <button id="restartBtn">Neustarten</button>
    <button onclick="location.href='index.html'">Zurück zur Auswahl</button>
  </div>

  <!-- On-Screen-Steuerung für Handy -->
  <div class="controls">
    <div class="empty"></div>
    <button id="btnRotate">⟳</button>
    <div class="empty"></div>

    <button id="btnLeft">◀</button>
    <div class="empty"></div>
    <button id="btnRight">▶</button>

    <div class="empty"></div>
    <button id="btnDown">▼</button>
    <div class="empty"></div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restartBtn');

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnDown = document.getElementById('btnDown');
    const btnRotate = document.getElementById('btnRotate');

    const cols = 10;
    const rows = 20;
    let blockSize;       // wird aus Canvas-Breite berechnet

    let arena, player, dropCounter, dropInterval, lastTime, score, gameOver;

    const colors = [
      null,
      'cyan',    // I
      'yellow',  // O
      'purple',  // T
      'green',   // S
      'red',     // Z
      'blue',    // J
      'orange',  // L
    ];

    function resizeCanvas() {
      const width = canvas.clientWidth;
      canvas.width = width;
      blockSize = Math.floor(width / cols);
      canvas.height = blockSize * rows;
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 0, 0],
          [3, 3, 3],
          [0, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [2, 2],
          [2, 2],
        ];
      } else if (type === 'L') {
        return [
          [0, 7, 0],
          [0, 7, 0],
          [0, 7, 7],
        ];
      } else if (type === 'J') {
        return [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 4, 4],
          [4, 4, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (
            m[y][x] !== 0 &&
            (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0
          ) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        score += 10;
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerDrop() {
      if (gameOver) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(offset) {
      if (gameOver) return;
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    function playerRotate(dir) {
      if (gameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerReset() {
      const pieces = 'ILJOTSZ';
      const type = pieces[(pieces.length * Math.random()) | 0];
      player.matrix = createPiece(type);
      player.pos.y = 0;
      player.pos.x =
        ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);
      if (collide(arena, player)) {
        // Game over
        gameOver = true;
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(
              (x + offset.x) * blockSize,
              (y + offset.y) * blockSize,
              blockSize,
              blockSize
            );
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over - Neustarten klicken', canvas.width / 2, canvas.height / 2);
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!gameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function init() {
      resizeCanvas();
      arena = createMatrix(cols, rows);
      player = {
        pos: { x: 0, y: 0 },
        matrix: null,
      };
      dropCounter = 0;
      dropInterval = 800;
      lastTime = 0;
      score = 0;
      gameOver = false;
      playerReset();
      updateScore();
    }

    // Tastatur-Steuerung
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') {
        playerMove(-1);
      } else if (event.key === 'ArrowRight') {
        playerMove(1);
      } else if (event.key === 'ArrowDown') {
        playerDrop();
      } else if (event.key === 'ArrowUp') {
        playerRotate(1);
      }
    });

    // On-Screen-Steuerung
    btnLeft.addEventListener('click', (e) => {
      e.preventDefault();
      playerMove(-1);
    });
    btnRight.addEventListener('click', (e) => {
      e.preventDefault();
      playerMove(1);
    });
    btnDown.addEventListener('click', (e) => {
      e.preventDefault();
      playerDrop();
    });
    btnRotate.addEventListener('click', (e) => {
      e.preventDefault();
      playerRotate(1);
    });

    restartBtn.addEventListener('click', () => {
      init();
    });

    window.addEventListener('resize', () => {
      // einfache Variante: bei Größenänderung neu starten
      init();
    });

    init();
    update();
  </script>
</body>
</html>
