<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 6vw;
      max-font-size: 28px;
    }

    canvas {
      background: #111;
      border: 2px solid #444;
      width: 90vw;          /* 90% der Bildschirmbreite */
      max-width: 400px;     /* auf großen Bildschirmen maximal 400px breit */
      touch-action: none;   /* besser für mobile Eingaben */
    }

    #info {
      margin-top: 10px;
      font-size: 4vw;
      max-font-size: 18px;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      background: #00bcd4;
      color: #fff;
      cursor: pointer;
      font-size: 4vw;
      max-font-size: 18px;
    }

    button:hover {
      background: #008ba3;
    }

    .buttons {
      display: flex;
      flex-direction: row;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <canvas id="game"></canvas>
  <div id="info">
    Mit den Pfeiltasten steuern (am Handy: Bildschirm drehen & On-Screen-Tasten).<br>
    Punkte: <span id="score">0</span>
  </div>
  <div class="buttons">
    <button id="restartBtn">Neustarten</button>
    <button onclick="location.href='index.html'">Zurück zur Auswahl</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restartBtn');

    // Spielfeld-Größe in Zellen (z.B. 20x20)
    const cells = 20;
    let cellSize; // wird aus der Canvas-Breite berechnet

    let snake, direction, nextDirection, food, score, gameLoop, gameOver;

    // Canvas-Größe an die aktuelle Breite anpassen
    function resizeCanvas() {
      // Breite aus CSS übernehmen
      const width = canvas.clientWidth;
      canvas.width = width;
      cellSize = Math.floor(width / cells);
      canvas.height = cellSize * cells;
    }

    function init() {
      resizeCanvas();
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      scoreEl.textContent = score;
      gameOver = false;

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 120);
    }

    function randomFood() {
      return {
        x: Math.floor(Math.random() * cells),
        y: Math.floor(Math.random() * cells)
      };
    }

    function update() {
      if (gameOver) return;

      // Richtung aktualisieren (damit schnelle Richtungswechsel sauber sind)
      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Kollision mit Wand
      if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells) {
        endGame();
        return;
      }

      // Kollision mit sich selbst
      for (let seg of snake) {
        if (seg.x === head.x && seg.y === head.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      // Essen einsammeln
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Hintergrund
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Essen
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);

      // Schlange
      ctx.fillStyle = 'lime';
      snake.forEach(seg => {
        ctx.fillRect(seg.x * cellSize, seg.y * cellSize, cellSize, cellSize);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over - Neustarten klicken', canvas.width / 2, canvas.height / 2);
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);
      draw();
    }

    // Tastatur-Steuerung (PC / externe Tastatur)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if (e.key === 'ArrowDown' && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if (e.key === 'ArrowLeft' && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if (e.key === 'ArrowRight' && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    // Bei Drehung / Größenänderung des Bildschirms neu berechnen
    window.addEventListener('resize', () => {
      // aktuelle Positionen skalieren (einfachste Variante: neu starten)
      init();
    });

    restartBtn.addEventListener('click', init);

    init();
  </script>
</body>
</html>
