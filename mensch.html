<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensch ärgere dich nicht</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 6vw;
      max-font-size: 28px;
    }

    #boardContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: #fff;
      border: 2px solid #333;
      box-sizing: border-box;
    }

    .field {
      border: 1px solid #ccc;
      box-sizing: border-box;
      position: relative;
      background: #e0e0e0;
    }

    /* Hauptlaufweg: weiße Felder */
    .field.main {
      background: #ffffff;
    }

    /* Finale Reihe: schwarze Felder */
    .field.goal {
      background: #000000;
    }

    /* Startbereiche in den Ecken, farbig wie bekannt */
    .field.home-red {
      background: #ffaaaa;
    }
    .field.home-blue {
      background: #aaaaff;
    }
    .field.home-green {
      background: #aaffaa;
    }
    .field.home-yellow {
      background: #fff3aa;
    }

    .piece {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      position: absolute;
      top: 15%;
      left: 15%;
      border: 2px solid #333;
      box-sizing: border-box;
    }

    .red   { background: #ff0000; }
    .blue  { background: #0000ff; }
    .green { background: #00aa00; }
    .yellow{ background: #ffcc00; }

    #info {
      margin-top: 10px;
      font-size: 4vw;
      max-font-size: 18px;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 8px 14px;
      font-size: 4vw;
      max-font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #007bff;
      color: #fff;
    }

    button:hover {
      background: #0056b3;
    }

    #diceResult {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Mensch ärgere dich nicht</h1>

  <div id="boardContainer">
    <div id="board"></div>
  </div>

  <div id="info">
    Spieler: <span id="currentPlayerLabel"></span> |
    Gewürfelt: <span id="diceResult">-</span>
  </div>

  <div class="buttons">
    <button id="rollDiceBtn">Würfeln</button>
    <button id="restartBtn">Neustart</button>
    <button onclick="location.href='index.html'">Zurück zur Auswahl</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const currentPlayerLabel = document.getElementById('currentPlayerLabel');
    const diceResultEl = document.getElementById('diceResult');
    const rollDiceBtn = document.getElementById('rollDiceBtn');
    const restartBtn = document.getElementById('restartBtn');

    const players = ['blue', 'green', 'yellow', 'red']; // Reihenfolge der Spieler
    let currentPlayerIndex = 0;
    let dice = null;
    let fields = []; // 11x11
    let pieces = {};
    let path = [];   // Hauptlaufweg
    let goalSegment = []; // finale Reihe (schwarze Felder)

    function idx(r, c) { return r * 11 + c; }

    function createBoard() {
      boardEl.innerHTML = '';
      fields = [];
      for (let i = 0; i < 121; i++) {
        const div = document.createElement('div');
        div.classList.add('field');
        boardEl.appendChild(div);
        fields.push(div);
      }

      // Hauptweg: ein Rechteck außen herum (wie ein Ring)
      path = [];
      // oben links nach rechts
      for (let c = 0; c < 11; c++) path.push(idx(0, c));
      // rechts oben nach unten
      for (let r = 1; r < 11; r++) path.push(idx(r, 10));
      // unten rechts nach links
      for (let c = 9; c >= 0; c--) path.push(idx(10, c));
      // links unten nach oben
      for (let r = 9; r > 0; r--) path.push(idx(r, 0));

      // Markiere Hauptweg als weiße Felder
      path.forEach(i => fields[i].classList.add('main'));

      // Finale Reihe: die letzten 4 Felder des Weges werden schwarz
      goalSegment = path.slice(-4);
      goalSegment.forEach(i => {
        fields[i].classList.add('goal');
      });

      // Startbereiche farbig wie beim klassischen Brett
      // oben links (rot)
      [idx(1,1), idx(1,2), idx(2,1), idx(2,2)].forEach(i => {
        fields[i].classList.add('home-red');
      });
      // oben rechts (blau)
      [idx(1,8), idx(1,9), idx(2,8), idx(2,9)].forEach(i => {
        fields[i].classList.add('home-blue');
      });
      // unten links (grün)
      [idx(8,1), idx(8,2), idx(9,1), idx(9,2)].forEach(i => {
        fields[i].classList.add('home-green');
      });
      // unten rechts (gelb)
      [idx(8,8), idx(8,9), idx(9,8), idx(9,9)].forEach(i => {
        fields[i].classList.add('home-yellow');
      });
    }

    function initPieces() {
      pieces = {};
      players.forEach(color => {
        pieces[color] = [];
        for (let i = 0; i < 4; i++) {
          pieces[color].push({
            position: -1, // -1 = Start (Haus), >=0 = Index im path, > path.length-1 = im „Ziel“ (aus dem Spiel)
            element: null
          });
        }
      });
      renderPieces();
    }

    function renderPieces() {
      // Erst alle Figuren löschen
      fields.forEach(f => {
        const child = f.querySelector('.piece');
        if (child) f.removeChild(child);
      });

      // Für jede Figur neu platzieren
      players.forEach(color => {
        pieces[color].forEach((p, i) => {
          if (p.position >= 0 && p.position < path.length) {
            const fieldIndex = path[p.position];
            const field = fields[fieldIndex];
            const div = document.createElement('div');
            div.classList.add('piece', color);
            div.dataset.color = color;
            div.dataset.index = i;
            field.appendChild(div);
            p.element = div;
          } else {
            p.element = null;
          }
        });
      });
    }

    function nextPlayer() {
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updateInfo();
    }

    function updateInfo() {
      currentPlayerLabel.textContent = players[currentPlayerIndex];
    }

    function rollDice() {
      dice = Math.floor(Math.random() * 6) + 1;
      diceResultEl.textContent = dice;
    }

    function onFieldClick(e) {
      const pieceDiv = e.target.closest('.piece');
      if (!pieceDiv) return;
      const color = pieceDiv.dataset.color;
      const index = Number(pieceDiv.dataset.index);
      const currentColor = players[currentPlayerIndex];
      if (color !== currentColor) return; // nur eigene Figuren

      if (!dice) return; // erst würfeln

      const p = pieces[color][index];

      // Sehr vereinfachte Logik:
      // - Wenn Figur im Haus (-1) und Wurf >= 1: Figur auf Startfeld
      // - Sonst: Ziehen um 'dice' Felder, ggf. schlagen
      if (p.position === -1) {
        p.position = startIndexFor(color);
      } else {
        p.position += dice;
        if (p.position > path.length) {
          // Figur ist komplett im "Ziel" verschwunden
          p.position = path.length + 1;
        }
      }

      // Gegner schlagen, wenn auf gleichem Feld des Weges
      players.forEach(col => {
        if (col === color) return;
        pieces[col].forEach(other => {
          if (
            other.position === p.position &&
            p.position < path.length &&
            p.position >= 0
          ) {
            other.position = -1; // zurück ins Haus
          }
        });
      });

      dice = null;
      diceResultEl.textContent = '-';
      renderPieces();

      if (checkWin(color)) {
        alert('Spieler ' + color + ' hat gewonnen!');
        return;
      }

      nextPlayer();
    }

    function startIndexFor(color) {
      // Startpositionen auf dem Ring (ungefähr vor den farbigen Ecken)
      if (color === 'red')   return 0;                            // oben links
      if (color === 'blue')  return Math.floor(path.length * 0.25); // oben rechts
      if (color === 'yellow')return Math.floor(path.length * 0.5);  // unten rechts
      if (color === 'green') return Math.floor(path.length * 0.75); // unten links
      return 0;
    }

    function checkWin(color) {
      // Gewonnen, wenn alle Figuren über das letzte Feld hinaus sind
      return pieces[color].every(p => p.position > path.length);
    }

    function restart() {
      dice = null;
      diceResultEl.textContent = '-';
      currentPlayerIndex = 0;
      updateInfo();
      initPieces();
    }

    boardEl.addEventListener('click', onFieldClick);
    rollDiceBtn.addEventListener('click', () => {
      if (!dice) rollDice();
    });
    restartBtn.addEventListener('click', restart);

    function init() {
      createBoard();
      initPieces();
      currentPlayerIndex = 0;
      updateInfo();
      dice = null;
      diceResultEl.textContent = '-';
    }

    init();
  </script>
</body>
</html>
