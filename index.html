<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiele-Auswahl</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #222;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .games {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .game-card {
      background: #333;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .game-card h2 {
      margin-top: 0;
    }
    .game-card button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #00bcd4;
      color: #fff;
      font-weight: bold;
    }
    .game-card button:hover {
      background: #008ba3;
    }
  </style>
</head>
<body>
  <h1>Wähle ein Spiel</h1>
  <div class="games">
    <div class="game-card">
      <h2>Tic Tac Toe</h2>
      <p>Spiele X gegen O auf einem 3x3 Feld.</p>
      <button onclick="location.href='tictactoe.html'">Starten</button>
    </div>

    <div class="game-card">
      <h2>Snake</h2>
      <p>Steuere die Schlange und sammle Essen.</p>
      <button onclick="location.href='snake.html'">Starten</button>
    </div>

    <div class="game-card">
      <h2>Tetris</h2>
      <p>Lasse die Blöcke fallen und bilde Reihen.</p>
      <button onclick="location.href='tetris.html'">Starten</button>
    </div>

    <div class="game-card">
  <h2>Mensch ärgere dich nicht</h2>
  <p>Spielt zu viert an einem Gerät.</p>
  <button onclick="location.href='mensch.html'">Starten</button>
</div>

  </div>
</body>
</html>
